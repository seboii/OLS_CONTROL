# OLS — TEK GİRİŞ NOKTASI
#
# Yığındaki tek yayınlanan port budur. API, PostgreSQL ve MSSQL dışarı hiç
# port açmaz; onlara yalnızca Docker ağı üzerinden bu nginx erişir.
#
# Böylece:
#   * dışarıdan saldırı yüzeyi tek porta iner,
#   * tarayıcı her şeyi AYNI köken üzerinden görür (CORS devreye girmez),
#   * cloudflared tüneli tek bir upstream'e bağlanır (bkz. infra/README.md).

# Ters vekil arkasında çalışırken gerçek şemayı API'ye taşı.
#
# `map` yalnızca http bağlamında tanımlanabilir — server bloğunun içine
# konulursa nginx "map directive is not allowed here" ile açılmaz. Bu dosya
# conf.d altından http bağlamına dahil edildiği için burası doğru yer.
#
# cloudflared HTTPS'i sonlandırdığı için $scheme konteyner içinde http kalır;
# gerçek şema X-Forwarded-Proto ile gelir ve olduğu gibi aktarılır.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
    http    http;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evrak yüklemeleri buradan geçiyor; API tarafındaki sınırla uyumlu olmalı.
    client_max_body_size 64m;

    # Sunucu sürümünü gizle — tünelin arkasında da olsa gereksiz bilgi.
    server_tokens off;

    # ------------------------------------------------------------------
    # API
    #
    # `api` adı Docker ağındaki servis adıdır; konteyner dışından erişilemez.
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Siber senkronu ve büyük rapor sorguları uzun sürebiliyor.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 30s;

        # Yanıtı tamponlamadan geç: uzun süren isteklerde bağlantı düşmesin.
        proxy_buffering off;
    }

    # Sağlık ucu — cloudflared ve izleme araçları buraya bakar.
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ------------------------------------------------------------------
    # Yüklenen evraklar
    #
    # `^~` ŞART: nginx'te regex location'lar prefix location'lardan ÖNCE
    # eşleşir. Aşağıdaki statik önbellek bloğu proxy_pass içermediği için,
    # `^~` olmadan .png/.jpg evraklar statik kökte aranıp 404 dönüyordu
    # (.pdf çalışıyordu, çünkü o listede yok).
    # ------------------------------------------------------------------
    location ^~ /storage/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 300s;
    }

    # ------------------------------------------------------------------
    # Statik arayüz
    # ------------------------------------------------------------------

    # Hash'li varlıklar (Vite çıktısı) uzun önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ASLA önbelleklenmez: yeni sürüm dağıtıldığında tarayıcı eski
    # varlık adlarını isteyip beyaz ekran vermesin.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # React Router: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml application/wasm;
}
