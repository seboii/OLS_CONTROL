server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    # Vue Router history mode: bilinmeyen yollar index.html'e duser.
    # olsold'da bu isi routes/admin.php icindeki catch-all Route::get('/{any}') yapiyordu.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API cagrilari .NET backend'e. Frontend kodu gorece yol kullaniyor
    # (axios.get("/api/v1/...")), bu yuzden ayni origin uzerinden gecmeli.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Yuklenen evraklar (olimpikgama'dan tasinan dosyalar).
    #
    # `^~` SART: nginx'te regex location'lar prefix location'lardan ONCE
    # eslesir. Asagidaki `\.(js|css|png|jpg|...)$` onbellek blogu proxy_pass
    # icermedigi icin, `^~` olmadan .png/.jpg evraklar statik kokte aranip
    # 404 donuyordu (.pdf calisiyordu, cunku o listede yok). `^~` regex
    # kontrolunu tamamen atlatir.
    location ^~ /storage/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
