# OLS — üretim/varsayılan yığın
#
# AĞ MİMARİSİ: dışarıya AÇILAN TEK PORT web (nginx) servisidir. API,
# PostgreSQL ve MSSQL hiç port yayınlamaz; birbirlerine yalnızca `ols-scoped`
# Docker ağı üzerinden, servis adlarıyla (api, postgres, siber-mock) erişirler.
#
#   tarayıcı ──▶ web (nginx, 8105) ──┬──▶ api:8080 ──┬──▶ postgres:5432
#                                    │               └──▶ siber-mock:1433
#                                    └── statik arayüz (aynı konteyner)
#
# Bunun sonucu:
#   * saldırı yüzeyi tek porta iner,
#   * tarayıcı her şeyi aynı köken üzerinden görür — CORS devreye girmez,
#   * cloudflared tüneli tek upstream'e bağlanır ve bu port da kapatılabilir
#     (bkz. infra/compose/cloudflared.yml).
#
# GELİŞTİRME: entegrasyon testleri localhost:5443'teki Postgres'e ihtiyaç
# duyar ve bu dosya o portu AÇMAZ. Yerelde çalışırken dev override'ı ekleyin:
#
#   docker compose -f docker-compose.yml -f infra/compose/dev.yml up -d
#
# ya da .env dosyanıza şunu yazın (sonra düz `docker compose up -d` yeter):
#
#   COMPOSE_FILE=docker-compose.yml:infra/compose/dev.yml
#
# Dağıtım dosyalarının tamamı infra/ altındadır (bkz. infra/README.md).

services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: ols-scoped-postgres
    # Port YAYINLANMAZ. Yalnızca ağ içinden erişilir.
    expose: ['5432']
    environment:
      POSTGRES_DB: '${DB_DATABASE:-ols_scoped}'
      POSTGRES_USER: '${DB_USERNAME:-postgres}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'ols-scoped-postgres:/var/lib/postgresql/data'
    networks: [ols-scoped]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-ols_scoped}']
      interval: 10s
      retries: 10
      timeout: 5s

  # Yerel sahte Siber. Gerçek Siber2022 şemasının birebir kopyası değildir;
  # amaç veri sadakati değil akış doğrulamasıdır.
  siber-mock:
    image: 'mcr.microsoft.com/mssql/server:2022-latest'
    container_name: ols-scoped-siber-mock
    expose: ['1433']
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: '${SIBER_SA_PASSWORD:-Ols!Local2026}'
      MSSQL_PID: 'Developer'
    volumes:
      - 'ols-scoped-siber:/var/opt/mssql'
      - './infra/docker/siber-mock:/init:ro'
    networks: [ols-scoped]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1']
      interval: 15s
      retries: 20
      timeout: 10s

  # Sahte Siber şemasını VE verisini bir kez kurar, sonra çıkar.
  #
  # Sıra ÖNEMLİ (dosyalar birbirinin şemasını ALTER ediyor):
  #   1) init.sql / init-reference.sql   — temel + referans şema iskeleti
  #   2) sample-movements.sql            — skn_yuk/skn_pozisyon/skn_yukaktarma'yı
  #                                         ETL-okuma şemasıyla YENİDEN kurar + örnek
  #                                         geçmiş veri ekler
  #   3) reservation-fix.sql             — skn_rezervasyon'u transfer_to_siber'in
  #                                         YAZDIĞI geniş şemayla kurar (bağımsız tablo)
  #   4) loadtransfer-fix.sql/loadrelease-fix.sql/pozisyon-fix.sql/mapping-fix.sql
  #                                       — (2)'nin kurduğu tabloları YAZMA tarafının
  #                                         ihtiyaç duyduğu ek kolonlarla ALTER eder;
  #                                         bu yüzden (2)'den SONRA gelmeli
  #   5) sample-data.sql / sample-reservation.sql
  #                                       — referans + rezervasyon VERİSİ, şema
  #                                         tamamlandıktan SONRA eklenir; ama
  #                                         sample-data.sql skn_sabittanim VE
  #                                         sdn_rezervasyondurum'u kendi (canlı
  #                                         doğrulanmamış) tahmini değerleriyle
  #                                         DELETE+INSERT ediyor
  #   6) reference-data-fix.sql          — (5)'in üzerine yazdığı skn_sabittanim/
  #                                         sdn_rezervasyondurum satırlarını 192.168.1.101
  #                                         üzerindeki GERÇEK sunucudan doğrulanan
  #                                         değerlerle değiştirir; bu yüzden EN SONDA
  #                                         çalışmalı (sample-data.sql'den SONRA)
  #   7) finance-fix.sql                  — muhasebe/finans (sfy_*) şeması
  # einvoice-fix.sql/kzgelirgider-fix.sql bilinçli olarak ÇALIŞTIRILMIYOR — Uyumsoft
  # e-fatura ve Reports/Hedef-ciro bu portun kapsamı dışında.
  siber-init:
    image: 'mcr.microsoft.com/mssql/server:2022-latest'
    container_name: ols-scoped-siber-init
    depends_on:
      siber-mock:
        condition: service_healthy
    volumes:
      - './infra/docker/siber-mock:/init:ro'
    networks: [ols-scoped]
    entrypoint: >
      /bin/bash -c "set -e; for f in init.sql init-reference.sql sample-movements.sql
      reservation-fix.sql loadtransfer-fix.sql loadrelease-fix.sql pozisyon-fix.sql
      mapping-fix.sql sample-data.sql sample-reservation.sql reference-data-fix.sql
      finance-fix.sql; do
      echo \">> $$f\";
      /opt/mssql-tools18/bin/sqlcmd -S siber-mock -U sa -P '${SIBER_SA_PASSWORD:-Ols!Local2026}' -C -i /init/$$f;
      done; echo 'sahte Siber semasi ve verisi kuruldu'"
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    container_name: ols-scoped-api
    # Port YAYINLANMAZ: tüm istekler web (nginx) üzerinden geliyor.
    # Doğrudan curl/Swagger denemesi için dev override'ı kullanın.
    expose: ['8080']
    environment:
      ASPNETCORE_ENVIRONMENT: '${ASPNETCORE_ENVIRONMENT:-Development}'
      ConnectionStrings__Postgres: 'Host=postgres;Port=5432;Database=${DB_DATABASE:-ols_scoped};Username=${DB_USERNAME:-postgres};Password=${DB_PASSWORD:-secret}'
      # Varsayılan: sahte Siber'e bağlanır — canlı ERP'ye DEĞİL.
      # Gerçek Siber'e geçmek için .env dosyanıza SIBER_CONNECTION_OVERRIDE ekleyin.
      ConnectionStrings__Siber: '${SIBER_CONNECTION_OVERRIDE:-Server=siber-mock,1433;Database=Siber2022;User Id=sa;Password=${SIBER_SA_PASSWORD:-Ols!Local2026};TrustServerCertificate=True}'
      # Siber hesabıyla giriş: kullanıcı e-postası + yerel şifresi YA DA Siber
      # kullanıcı kodu + Siber şifresiyle girebilir. Şifre uygulamaya hiç gelmez,
      # doğrulama Siber sunucusunda PWDCOMPARE ile yapılır (bkz.
      # ISiberUserRepository). false yapılırsa yalnızca yerel şifreler kalır.
      Siber__LoginEnabled: '${SIBER_LOGIN_ENABLED:-true}'
      # Siber'den gelen kullanıcıların şifresi yoktur (bkz. IDefaultUserPassword).
      # Şifresi boş olan HERKESE bu şifre atanır; mevcut şifreler ezilmez.
      Seed__DefaultUserPassword: '${SEED_DEFAULT_USER_PASSWORD:-Admin123}'
      # TEK SEFERLİK bakım anahtarı: true iken MEVCUT şifreler dahil TÜM
      # kullanıcılar yukarıdaki şifreye döndürülür. Kullandıktan sonra false yapın.
      Seed__ResetAllPasswords: '${SEED_RESET_ALL_PASSWORDS:-false}'
      # TEK SEFERLİK: true iken açılışta Siber departmanlarına göre rol uygulanır.
      Seed__ApplyRolesFromSiber: '${SEED_APPLY_ROLES:-false}'
      Jwt__Key: '${JWT_KEY:-yerel-test-anahtari-en-az-32-bayt-olmali-0000}'
      Jwt__Issuer: '${JWT_ISSUER:-ols-api}'
      Jwt__Audience: '${JWT_AUDIENCE:-ols-app}'
      # Arayüz ve API aynı köken (nginx) üzerinden çalıştığı için CORS normalde
      # devreye girmez. Bu girdiler yalnızca API'ye doğrudan istek atan bir
      # araç/sayfa olduğunda anlamlı — ör. dev override'la açılan 8106.
      Cors__AllowedOrigins__0: 'http://localhost:${WEB_PORT:-8105}'
      Cors__AllowedOrigins__1: '${PUBLIC_ORIGIN:-http://localhost:${WEB_PORT:-8105}}'
    volumes:
      - './storage/app/public:/app/storage/app/public'
    networks: [ols-scoped]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # TEK GİRİŞ NOKTASI: statik arayüzü servis eder, /api ve /storage'ı
  # ağ içinden API'ye geçirir (bkz. infra/docker/web/nginx.conf).
  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    container_name: ols-scoped-web
    ports:
      # Yığındaki TEK yayınlanan port. Cloudflared kullanıldığında bu satır
      # da kaldırılabilir (bkz. infra/compose/cloudflared.yml).
      - '${WEB_BIND_HOST:-0.0.0.0}:${WEB_PORT:-8105}:80'
    networks:
      ols-scoped:
        # `nginx` takma adı BİLİNÇLİ: Cloudflare tünelinde origin adresi
        # elle yazılıyor ve servisin nginx olduğunu bilen herkes doğal olarak
        # `http://nginx:80` yazıyor. Takma ad olmadan tünel
        # "lookup nginx: no such host" ile 502 veriyor. Her iki ad da çalışır.
        aliases: [nginx]
    restart: unless-stopped
    depends_on: [api]

networks:
  ols-scoped:
    driver: bridge
    name: ols-scoped

volumes:
  ols-scoped-postgres: { driver: local }
  ols-scoped-siber: { driver: local }
