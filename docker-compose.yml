# OLS scoped stack: web -> API -> PostgreSQL / sahte Siber (MSSQL)
#
# Yalnızca 8 modül (Müşteri, Teklif, Yük, Sefer, Fatura, Araç, Kullanıcılar,
# Destek Talebi) için gerekli servisler. MongoDB (mesajlaşma) ve Socket.IO
# kapsam dışı olduğu için bu yığında YOK.
#
# Tamamı yerelde çalışır, CANLI hiçbir sisteme bağlanmaz:
#   - Siber entegrasyonu "siber-mock" konteynerine gider (canlı sunucuya DEĞİL)
#
# Portlar, aynı makinede çalışabilecek olsnew (5433/8006/8005/1434) ve diğer
# projelerle çakışmasın diye kaydırıldı (5443/8106/8105/1444).

services:
  postgres:
    image: 'postgres:16-alpine'
    container_name: ols-scoped-postgres
    ports:
      # AĞA AÇMA NOTU: veritabanı portu bilerek YALNIZCA bu makineye bağlı
      # (127.0.0.1). Telefon/diğer bilgisayarın Postgres'e doğrudan erişmesine
      # gerek yok — uygulama trafiği frontend (8105) üzerinden geçiyor. Başka
      # bir makineden pgAdmin ile bağlanmak isterseniz .env'e DB_BIND_HOST=0.0.0.0
      # yazın (Public Wi-Fi'da ÖNERİLMEZ: parola varsayılan 'secret').
      - '${DB_BIND_HOST:-127.0.0.1}:${FORWARD_DB_PORT:-5443}:5432'
    environment:
      POSTGRES_DB: '${DB_DATABASE:-ols_scoped}'
      POSTGRES_USER: '${DB_USERNAME:-postgres}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'ols-scoped-postgres:/var/lib/postgresql/data'
    networks: [ols-scoped]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-ols_scoped}']
      interval: 10s
      retries: 10
      timeout: 5s

  # Yerel sahte Siber. Gerçek Siber2022 şemasının birebir kopyası değildir;
  # amaç veri sadakati değil akış doğrulamasıdır.
  siber-mock:
    image: 'mcr.microsoft.com/mssql/server:2022-latest'
    container_name: ols-scoped-siber-mock
    ports:
      # Aynı gerekçe (bkz. postgres): SA parolası .env'de duruyor, MSSQL'i
      # ağa açmanın uygulama açısından hiçbir faydası yok.
      - '${SIBER_BIND_HOST:-127.0.0.1}:${FORWARD_SIBER_PORT:-1444}:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: '${SIBER_SA_PASSWORD:-Ols!Local2026}'
      MSSQL_PID: 'Developer'
    volumes:
      - 'ols-scoped-siber:/var/opt/mssql'
      - './docker/siber-mock:/init:ro'
    networks: [ols-scoped]
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1']
      interval: 15s
      retries: 20
      timeout: 10s

  # Sahte Siber şemasını VE verisini bir kez kurar, sonra çıkar.
  #
  # Sıra ÖNEMLİ (dosyalar birbirinin şemasını ALTER ediyor):
  #   1) init.sql / init-reference.sql   — temel + referans şema iskeleti
  #   2) sample-movements.sql            — skn_yuk/skn_pozisyon/skn_yukaktarma'yı
  #                                         ETL-okuma şemasıyla YENİDEN kurar + örnek
  #                                         geçmiş veri ekler
  #   3) reservation-fix.sql             — skn_rezervasyon'u transfer_to_siber'in
  #                                         YAZDIĞI geniş şemayla kurar (bağımsız tablo)
  #   4) loadtransfer-fix.sql/loadrelease-fix.sql/pozisyon-fix.sql/mapping-fix.sql
  #                                       — (2)'nin kurduğu tabloları YAZMA tarafının
  #                                         ihtiyaç duyduğu ek kolonlarla ALTER eder;
  #                                         bu yüzden (2)'den SONRA gelmeli
  #   5) sample-data.sql / sample-reservation.sql
  #                                       — referans + rezervasyon VERİSİ, şema
  #                                         tamamlandıktan SONRA eklenir; ama
  #                                         sample-data.sql skn_sabittanim VE
  #                                         sdn_rezervasyondurum'u kendi (canlı
  #                                         doğrulanmamış) tahmini değerleriyle
  #                                         DELETE+INSERT ediyor
  #   6) reference-data-fix.sql          — (5)'in üzerine yazdığı skn_sabittanim/
  #                                         sdn_rezervasyondurum satırlarını 192.168.1.101
  #                                         üzerindeki GERÇEK sunucudan doğrulanan
  #                                         değerlerle değiştirir; bu yüzden EN SONDA
  #                                         çalışmalı (sample-data.sql'den SONRA)
  # einvoice-fix.sql/kzgelirgider-fix.sql bilinçli olarak ÇALIŞTIRILMIYOR — Uyumsoft
  # e-fatura ve Reports/Hedef-ciro bu portun kapsamı dışında (bkz. TESLIM-RAPORU.md §1).
  siber-init:
    image: 'mcr.microsoft.com/mssql/server:2022-latest'
    container_name: ols-scoped-siber-init
    depends_on:
      siber-mock:
        condition: service_healthy
    volumes:
      - './docker/siber-mock:/init:ro'
    networks: [ols-scoped]
    entrypoint: >
      /bin/bash -c "set -e; for f in init.sql init-reference.sql sample-movements.sql
      reservation-fix.sql loadtransfer-fix.sql loadrelease-fix.sql pozisyon-fix.sql
      mapping-fix.sql sample-data.sql sample-reservation.sql reference-data-fix.sql
      finance-fix.sql; do
      echo \">> $$f\";
      /opt/mssql-tools18/bin/sqlcmd -S siber-mock -U sa -P '${SIBER_SA_PASSWORD:-Ols!Local2026}' -C -i /init/$$f;
      done; echo 'sahte Siber semasi ve verisi kuruldu'"
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: ols-scoped-api
    ports:
      # API'yi ağa açmak ŞART DEĞİL: frontend'in nginx'i /api/ isteklerini
      # konteyner ağı üzerinden (http://api:8080) geçiriyor, yani telefon
      # yalnızca 8105'e bağlanır. Bu port doğrudan Swagger/curl denemesi için
      # duruyor; kapatmak isterseniz .env'e API_BIND_HOST=127.0.0.1 yazın.
      - '${API_BIND_HOST:-0.0.0.0}:${API_PORT:-8106}:8080'
    environment:
      ASPNETCORE_ENVIRONMENT: '${ASPNETCORE_ENVIRONMENT:-Development}'
      ConnectionStrings__Postgres: 'Host=postgres;Port=5432;Database=${DB_DATABASE:-ols_scoped};Username=${DB_USERNAME:-postgres};Password=${DB_PASSWORD:-secret}'
      # Varsayılan: sahte Siber'e bağlanır — canlı ERP'ye DEĞİL.
      # Gerçek Siber'e geçmek için .env dosyanıza SIBER_CONNECTION_OVERRIDE
      # ekleyin (bkz. .env.example) — bu tracked dosyaya DOKUNMAYA gerek yok.
      ConnectionStrings__Siber: '${SIBER_CONNECTION_OVERRIDE:-Server=siber-mock,1433;Database=Siber2022;User Id=sa;Password=${SIBER_SA_PASSWORD:-Ols!Local2026};TrustServerCertificate=True}'
      # Siber__SyncIntervalMinutes: appsettings.json'daki varsayılan (15 dk) kullanılıyor.
      # Siber'den gelen kullanıcıların şifresi yoktur (bkz. IDefaultUserPassword).
      # Şifresi boş olan HERKESE bu şifre atanır; mevcut şifreler ezilmez.
      Seed__DefaultUserPassword: '${SEED_DEFAULT_USER_PASSWORD:-Admin123}'
      # TEK SEFERLİK bakım anahtarı: true iken MEVCUT şifreler dahil TÜM
      # kullanıcılar yukarıdaki şifreye döndürülür. Her açılışta çalışır —
      # kullandıktan sonra .env'de false yapın.
      Seed__ResetAllPasswords: '${SEED_RESET_ALL_PASSWORDS:-false}'
      # TEK SEFERLİK: true iken açılışta Siber departmanlarına göre rol uygulanır
      # ve Siber'de engelli kullanıcılar pasife alınır. Kullandıktan sonra false.
      Seed__ApplyRolesFromSiber: '${SEED_APPLY_ROLES:-false}'
      Jwt__Key: '${JWT_KEY:-yerel-test-anahtari-en-az-32-bayt-olmali-0000}'
      Jwt__Issuer: '${JWT_ISSUER:-ols-api}'
      Jwt__Audience: '${JWT_AUDIENCE:-ols-app}'
      Cors__AllowedOrigins__0: 'http://localhost:${FRONTEND_PORT:-8105}'
      # Ağdan girişte tarayıcının origin'i http://<LAN-IP>:8105 olur. Uygulama
      # aynı origin üzerinden (nginx proxy) çalıştığı için CORS devreye girmez,
      # ama API'ye 8106'dan doğrudan istek atan bir sayfa/araç olursa diye
      # LAN adresi de listeye alınabiliyor (.env: LAN_ORIGIN).
      Cors__AllowedOrigins__1: '${LAN_ORIGIN:-http://localhost:${FRONTEND_PORT:-8105}}'
    volumes:
      - './storage/app/public:/app/storage/app/public'
    networks: [ols-scoped]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: ols-scoped-frontend
    ports:
      # Kullanıcıların (telefon/diğer bilgisayar) girdiği TEK port bu.
      - '${FRONTEND_BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-8105}:80'
    networks: [ols-scoped]
    depends_on: [api]

networks:
  ols-scoped:
    driver: bridge
    name: ols-scoped

volumes:
  ols-scoped-postgres: { driver: local }
  ols-scoped-siber: { driver: local }
